<section class="contact-section " id="contact">
     <h2 class="contact-title">Let's Connect</h2>

     <div class="contact-grid">
          <!-- Contact Info Cards -->
          <div class="contact-info">
               <div class="info-card glass" data-aos="fade-up">
                    <i class="fas fa-envelope icon"></i>
                    <div>
                         <h4>Email</h4>
                         <!-- <p>sheheryafreen@gmail.com</p> -->
                    </div>
               </div>

               <div class="info-card glass" data-aos="fade-up" data-aos-delay="100">
                    <i class="fas fa-phone icon"></i>
                    <div>
                         <h4>Phone</h4>
                         <p>+91 8746801878</p>
                    </div>
               </div>

               <div class="info-card glass" data-aos="fade-up" data-aos-delay="200">
                    <i class="fas fa-map-marker-alt icon"></i>
                    <div>
                         <h4>Location</h4>
                         <p>Gulbarga Karnataka, India</p>
                    </div>
               </div>
               <!-- Social Media Card -->
               <div class="info-card glass" data-aos="fade-up" data-aos-delay="300">
                    <!-- <i class="fas fa-share-alt icon"></i> -->
                    <div>

                         <div class="social-icon">
                              <a href="https://www.linkedin.com/in/afreen-banu-743a2522a/" target="_blank"
                                   title="LinkedIn">
                                   <i class="fab fa-linkedin icon"></i>
                              </a>
                              <a href="https://github.com/afreenshehery" target="_blank" title="GitHub">
                                   <i class="fab fa-github icon"></i>
                              </a>
                              <a href="mailto:sheheryafreen@gmail.com" title="Email">
                                   <i class="fas fa-envelope icon"></i>
                              </a>
                              <a href="https://x.com/AfreenShehery" target="_blank" title="Twitter">
                                   <i class="fab fa-twitter icon"></i>
                              </a>
                         </div>
                    </div>
               </div>

          </div>

          <!-- Contact Form -->
          <form action="https://formspree.io/f/mjkwdvqj" method="POST" class="contact-form glass" #form="ngForm"
               (ngSubmit)="onSubmit()" [formGroup]="contactForm" data-aos="fade-left">
               <h3>Send Me a Message</h3>
               <div class="form-group">
                    <input type="text" formControlName="name" placeholder="Your Name" required />
               </div>
               <div class="form-group">
                    <input type="email" formControlName="email" placeholder="Your Email" required />
               </div>
               <div class="form-group">
                    <textarea name="message" placeholder="Your Message" rows="5"></textarea>
               </div>
               <button type="submit" [disabled]="!form.valid" class="glow-btn">Send</button>
          </form>
          <!-- 

          <div *ngIf="successMessage" style="color: green;">{{ successMessage }}</div>
          <div *ngIf="errorMessage" style="color: red;">{{ errorMessage }}</div> -->





     </div>
</section>
