<section class="projects-section" id="projects">
     <h2 class="section-title">Projects</h2>

     <div class="project-card" *ngFor="let project of projects; let i = index" [ngClass]="{ 'reverse': i % 2 !== 0 }">
          <div class="project-image">
               <img [src]="project.image" [alt]="project.title" />
          </div>
          <div class="project-content">
               <h3><img class="logo" src={{project.logo}} alt="">{{ project.title }}</h3>
               <p>{{ project.description }}</p>
               <!-- <a class="project-button" [href]="project.link" target="_blank">View Project</a> -->
               <a href="https://campusfloor.com/index.html" target="_blank" class="btn visit-link">
                    Visit Website <span>&rarr;</span>
               </a>
          </div>
     </div>
</section>
